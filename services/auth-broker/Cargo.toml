[package]
name = "xpflow-auth-broker"
version = "0.1.0"
description = "XP FLOW Auth Broker - minimal confidential OAuth exchange service for TikTok/Kwai"
edition = "2021"
publish = false

# Deliberately its own crate, not a workspace member of the desktop
# app (services/auth-broker/README.md explains why): this is a
# separately deployable service with its own lifecycle, its own
# Cargo.lock, and its own (much smaller) dependency surface. It must
# never gain a dependency on `xp-flow` (the desktop crate) or vice
# versa.

[[bin]]
name = "xpflow-auth-broker"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
