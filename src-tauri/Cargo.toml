[package]
name = "xp-flow"
version = "0.1.0"
description = "XP FLOW - Content Operations Platform"
authors = ["XP FLOW"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xp_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
directories = "5"
async-trait = "0.1"
notify = "8"
notify-debouncer-full = "0.5"
walkdir = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
percent-encoding = "2"
mime_guess = "2"
opener = { version = "0.7", features = ["reveal"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
